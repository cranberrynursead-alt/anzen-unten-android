name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - uses: actions/cache@v4
        with:
          path: signing.jks
          key: signing-key-v1
      - name: Create signing key if missing
        run: test -f signing.jks || keytool -genkeypair -keystore signing.jks -storepass anzenunten -keypass anzenunten -alias anzen -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Anzen Unten, O=Cranberry"
      - run: gradle --no-daemon assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk anzen-unten.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: anzen-unten.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: anzen-unten.apk
