plugins { id 'com.android.application' }
android {
    namespace 'jp.cranberry.anzen'
    compileSdk 34
    defaultConfig {
        applicationId 'jp.cranberry.anzen'
        minSdk 26
        targetSdk 34
        versionCode 17
        versionName '1.16'
    }
    signingConfigs {
        shared {
            storeFile file('../signing.jks')
            storePassword 'anzenunten'
            keyAlias 'anzen'
            keyPassword 'anzenunten'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.shared }
        debug { signingConfig signingConfigs.shared }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError false; checkReleaseBuilds false }
}
dependencies {
    // 車で動き出したことの検知（自動開始）に使う
    implementation 'com.google.android.gms:play-services-location:21.3.0'
}
